name: "Docker Buildx Bake"

on:
  workflow_call:
    inputs:
      images:
        type: string
        description: "List of images to build"
        required: true
        default: "alpine:3.14"
      flavor:
        type: string
        description: "Flavor of the images"
      tags:
        type: string
        description: "Tags for the images"
        required: true
    secrets:
      DOCKERHUB_TOKEN:
        description: "The login token for docker.io"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - if: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        name: Login to docker.io
        uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: docker-meta
        uses: docker/metadata-action@v5
        env:
          ALPINE_VERSION: ${{ matrix.alpine }}
        with:
          images: ${{ github.event.inputs.images }}
          flavor: ${{ github.event.inputs.flavor }}
          tags: ${{ github.event.inputs.tags }}

      - name: Generate GitHub metadata
        id: github-meta
        uses: dockerbakery/github-metadata-action@v2

      - name: Build and push
        uses: docker/bake-action@v4
        with:
          push: ${{ github.event_name != 'pull_request' }}
          files: |
            ./docker-bake.hcl
            ${{ steps.docker-meta.outputs.bake-file }}
            ${{ steps.github-meta.outputs.bake-file }}
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      - name: Docker Metadata Summary
        uses: dockerbakery/docker-metadata-summary@v1
